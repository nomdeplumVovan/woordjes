name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Держим одну выкладку за раз, но очередь не рубим:
# прерванный деплой оставил бы Pages на половине артефакта.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Pages отдаёт сайт из подкаталога, а не с корня домена:
      # без --base-href приложение искало бы скрипты в /.
      - run: npm run build -- --base-href /woordjes/

      # Клиентский роутинг: Pages статичен и про /setup не знает,
      # поэтому прямой заход отдаём тем же index.html.
      - run: cp dist/woordjes/browser/index.html dist/woordjes/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/woordjes/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
