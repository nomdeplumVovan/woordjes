<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Woordjes</title>
    <base href="/" />

    <!--
      viewport-fit=cover нужен, чтобы Ionic знал про «чёлку» и вырезы iPhone
      и сам добавлял отступы через safe-area.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f3a8a" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!--
      iOS не читает иконки и имя из манифеста при добавлении на домашний экран —
      ему нужны свои мета-теги, иначе на экране окажется скриншот страницы.
    -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-title" content="Woordjes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
